name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # This project deliberately phones home nowhere; keep CI consistent with that.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    # 20.x is the floor next@16 declares (engines.node >=20.9.0) and the README
    # promises; 24.x guards against breakage on a current release line.
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Fails outright if package.json and package-lock.json have drifted,
      # which is coverage worth having on its own.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  audit:
    # No npm ci: npm audit resolves the tree from package-lock.json alone, so
    # this stays fast and independent of the install succeeding.
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm audit --audit-level=high
